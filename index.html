<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="icon" href="favicon.png">
	<title>Pixel Shot</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<main></main>
	<div id="start-screen">
		<h1>Pixel Shot</h1>
		<p>Press the START button to begin!</p>
		<button id="start-button">START</button>
		<button id="instructions-button">How to Play?</button>
		<div id="instructions-popup" class="hidden">
			<div class="popup-content">
				<h2>How to Play</h2>
				<p>Press SPACE to jump.</p>
				<p>Go through hoops to gain points.</p>
				<p>If you miss a hoop you get a strike.</p>
				<p>3 strikes and the game ends.</p>
				<p>Stay inside the screen.</p>
				<p>The higher your score, the faster the court moves.</p>
				<button id="close-instructions">Close</button>
			</div>
		</div>
	</div>

	<div id="lose-screen" class="hidden">
		<h1>Game Over</h1>
		<p>You lost the game :(</p>
		<button id="lose-button">BACK TO START</button>
	</div>

	<!-- ONLINE LINKS -->
	<script src="https://q5js.org/q5.js"></script>
	<script src="https://q5play.org/q5play.js"></script>
